<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JisScroL — Sign In</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    *, *::before, *::after { 
      box-sizing: border-box; 
      margin: 0; 
      padding: 0; 
    }

    body {
      background: #0a0a0a;
      color: #e8e8e8;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      line-height: 1.6;
    }

    .container {
      width: 100%;
      max-width: 360px;
    }

    .header {
      text-align: center;
      margin-bottom: 48px;
    }

    .logo img {
      width: 80px;
      height: 80px;
      margin-bottom: 16px;
      display: block;
    }

    .logo-text {
      font-size: 32px;
      font-weight: 600;
      color: white;
      letter-spacing: -0.01em;
      margin-bottom: 4px;
    }

    .logo-sub {
      font-size: 13px;
      color: #888;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      font-weight: 500;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-group.hidden {
      display: none;
    }

    label {
      display: block;
      font-size: 14px;
      color: #aaa;
      letter-spacing: 0.02em;
      margin-bottom: 8px;
      font-weight: 500;
      text-transform: uppercase;
    }

    input {
      width: 100%;
      background: #111;
      border: 1px solid #222;
      border-radius: 6px;
      color: #e8e8e8;
      font-family: inherit;
      font-size: 16px;
      padding: 12px 14px;
      outline: none;
      transition: all 0.2s ease;
    }

    input:focus {
      border-color: #c9a96e;
      background: #0f0f0f;
      box-shadow: 0 0 0 3px rgba(201, 169, 110, 0.1);
    }

    input::placeholder {
      color: #555;
    }

    .button-group {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 28px;
      margin-bottom: 20px;
    }

    button {
      font-family: inherit;
      cursor: pointer;
      border-radius: 6px;
      font-size: 15px;
      font-weight: 500;
      letter-spacing: 0.02em;
      transition: all 0.2s ease;
      border: none;
    }

    .btn-primary {
      width: 100%;
      background: #c9a96e;
      color: #0a0a0a;
      padding: 12px 16px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .btn-primary:hover:not(:disabled) {
      background: #dab882;
      transform: translateY(-1px);
    }

    .btn-primary:active:not(:disabled) {
      transform: translateY(0);
    }

    .btn-primary:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .btn-google {
      width: 100%;
      background: transparent;
      border: 1px solid #222;
      color: #e8e8e8;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .btn-google:hover {
      border-color: #444;
      background: rgba(255, 255, 255, 0.02);
    }

    .divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 20px 0;
    }

    .divider::before, .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: #222;
    }

    .divider span {
      font-size: 12px;
      color: #555;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .btn-toggle {
      width: 100%;
      background: transparent;
      border: none;
      color: #e8e8e8;
      padding: 12px 0;
      font-size: 14px;
      text-align: center;
      cursor: pointer;
      transition: color 0.2s;
    }

    .btn-toggle:hover {
      color: #c9a96e;
    }

    .btn-toggle b {
      color: #c9a96e;
      font-weight: 600;
    }

    .message {
      font-size: 14px;
      text-align: center;
      margin-top: 16px;
      min-height: 20px;
      letter-spacing: 0.02em;
      border-radius: 4px;
      padding: 8px;
    }

    .message.error {
      color: #ff6b6b;
      background: rgba(255, 107, 107, 0.1);
    }

    .message.success {
      color: #7ccd7c;
      background: rgba(124, 205, 124, 0.1);
    }

    /* Responsive adjustments */
    @media (max-width: 480px) {
      body {
        padding: 16px;
      }

      .container {
        max-width: 100%;
      }

      .header {
        margin-bottom: 40px;
      }

      .logo img {
        width: 70px;
        height: 70px;
      }

      .logo-text {
        font-size: 28px;
      }

      input {
        font-size: 16px;
        padding: 14px 12px;
      }
    }

    @media (max-width: 360px) {
      .logo img {
        width: 60px;
        height: 60px;
      }

      .logo-text {
        font-size: 24px;
      }

      .button-group {
        gap: 8px;
        margin-top: 24px;
      }
    }

    /* Reduced motion support */
    @media (prefers-reduced-motion: reduce) {
      * {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>

<div class="container">
  <div class="header">
    <div class="logo-text"><img  style="width: 120px; height: 70px;" src="/pics/logo4.png" alt="JisScroL"></div>
    <div class="logo-sub">Member Access</div>
  </div>

  <form id="auth-form" onsubmit="handleAuth(event)">
    <div class="form-group hidden" id="reg-name-field">
      <label for="l-name">Display name</label>
      <input type="text" id="l-name" placeholder="How you'll appear to others">
    </div>

    <div class="form-group">
      <label for="l-email">Email address</label>
      <input type="email" id="l-email" placeholder="you@example.com" required>
    </div>

    <div class="form-group">
      <label for="l-pass">Password</label>
      <input type="password" id="l-pass" placeholder="••••••••" required>
    </div>

    <div class="button-group">
      <button type="submit" class="btn-primary" id="btn-main">Sign In</button>
      <div class="divider"><span>or</span></div>
      <button type="button" class="btn-google" onclick="signInGoogle()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
          <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
          <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
          <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
          <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
        </svg>
        <span>Continue with Google</span>
      </button>
    </div>

    <button type="button" class="btn-toggle" onclick="switchMode()">
      No account? <b>Create one</b>
    </button>

    <div class="message" id="msg"></div>
  </form>
</div>

<script>
  const SURL = 'https://jzspezkljbxocqboqgtk.supabase.co';
  const SKEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imp6c3BlemtsamJ4b2NxYm9xZ3RrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzczMTU4MjMsImV4cCI6MjA5Mjg5MTgyM30.VXZ4ZX9_z33ZKrWUbhs2EXKruTi1kp5IpLuGLykF1y0';
  
  const sb = supabase.createClient(SURL, SKEY);
  let mode = 'login';

  // Check if already logged in
  sb.auth.getSession().then(function(r) {
    if (r.data.session) window.location.href = 'index.html';
  });

  function switchMode() {
    mode = mode === 'login' ? 'register' : 'login';
    const nameField = document.getElementById('reg-name-field');
    const btn = document.getElementById('btn-main');
    const switchBtn = document.querySelector('.btn-toggle');
    
    nameField.classList.toggle('hidden');
    btn.textContent = mode === 'login' ? 'Sign In' : 'Create Account';
    switchBtn.innerHTML = mode === 'login' 
      ? 'No account? <b>Create one</b>' 
      : 'Already have an account? <b>Sign in</b>';
    
    clearMessage();
  }

  function handleAuth(event) {
    event.preventDefault();
    
    const email = document.getElementById('l-email').value.trim();
    const pass = document.getElementById('l-pass').value;
    const btn = document.getElementById('btn-main');

    if (!email || !pass) {
      showMessage('Please fill in all fields', 'error');
      return;
    }

    btn.disabled = true;
    const originalText = btn.textContent;
    btn.textContent = 'Please wait…';

    if (mode === 'login') {
      sb.auth.signInWithPassword({ email, password: pass })
        .then(function(r) {
          if (r.error) {
            showMessage(r.error.message, 'error');
            btn.disabled = false;
            btn.textContent = originalText;
          } else {
            showMessage('Welcome back!', 'success');
            setTimeout(() => window.location.href = '/index.html', 600);
          }
        });
    } else {
      const name = document.getElementById('l-name').value.trim();
      if (!name) {
        showMessage('Enter a display name', 'error');
        btn.disabled = false;
        btn.textContent = originalText;
        return;
      }
      if (pass.length < 6) {
        showMessage('Password must be at least 6 characters', 'error');
        btn.disabled = false;
        btn.textContent = originalText;
        return;
      }

      sb.auth.signUp({
        email,
        password: pass,
        options: { data: { display_name: name } }
      })
        .then(function(r) {
          if (r.error) {
            showMessage(r.error.message, 'error');
            btn.disabled = false;
            btn.textContent = originalText;
          } else {
            showMessage('Account created!', 'success');
            setTimeout(() => window.location.href = '/index.html', 600);
          }
        });
    }
  }

  function signInGoogle() {
    sb.auth.signInWithOAuth({
      provider: 'google',
      options: { redirectTo: window.location.origin + '/index.html' }
    });
  }

  function showMessage(text, type) {
    const el = document.getElementById('msg');
    el.textContent = text;
    el.className = 'message ' + type;
  }

  function clearMessage() {
    const el = document.getElementById('msg');
    el.textContent = '';
    el.className = 'message';
  }
</script>

</body>
</html>
