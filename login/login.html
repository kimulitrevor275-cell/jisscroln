<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JisScroL — Sign In</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #0a0a0a;
    color: #e8e8e8;
    font-family: monospace;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px 16px;
    width:100%;
  }

  .logo {
   
    color: white;
    text-align: center;
    margin-bottom: 4px;
    letter-spacing: 0.1em;
  }
  .logo img{
    width:100px;
  }

  .logo-sub {
    font-size: 11px;
    color: white;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    text-align: center;
    margin-bottom: 36px;
  }

  .card {
    width: 100%;
    max-width: 360px;
    background: #111;
    border: 1px solid #222;
    border-radius: 4px;
    padding: 28px 24px;
  }

  .field { margin-bottom: 14px; }

  .field label {
    display: block;
    font-size: 10px;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    color: white;
    margin-bottom: 6px;
  }

  .field input {
    width: 100%;
    background: #0a0a0a;
    border: 1px solid #222;
    border-radius: 10px;
    color: #e8e8e8;
    font-family: monospace;
    font-size: 14px;
    padding: 12px 14px;
    outline: none;
    transition: border-color 0.2s;
  }

  .field input:focus { border-color: #c9a96e; }
  .field input::placeholder { color: gray; }

  #reg-name-field { display: none; }

  .btn-main {
    width: 100%;
    background: none;
    border: 1px solid #c9a96e;
    color: #c9a96e;
    font-family: monospace;
    font-size: 12px;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    padding: 14px;
    cursor: pointer;
    border-radius: 10px;
    margin-top: 4px;
    margin-bottom: 10px;
    transition: background 0.2s, color 0.2s;
  }
  .btn-main:hover { background: #c9a96e; color: #0a0a0a; }
  .btn-main:disabled { opacity: 0.4; cursor: not-allowed; }

  .divider {
    display: flex;
    align-items: center;
    gap: 12px;
    margin: 16px 0;
  }
  .divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: #222; }
  .divider span { font-size: 10px; color: #444; letter-spacing: 0.2em; }

  .btn-google {
    width: 100%;
    background: none;
    border: 1px solid #222;
    color: #e8e8e8;
    font-family: monospace;
    font-size: 12px;
    letter-spacing: 0.1em;
    padding: 13px;
    cursor: pointer;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    transition: border-color 0.2s;
    margin-bottom: 16px;
  }
  .btn-google:hover { border-color: #555; }

  .btn-switch {
    width: 100%;
    background: none;
    border: none;
    color: white;
    font-family: monospace;
    font-size: 11px;
    letter-spacing: 0.1em;
    padding: 8px;
    cursor: pointer;
    text-align: center;
  }
  .btn-switch:hover { color: white; }
b{
  color:#c9a96e;
  text-decoration:underline;
}
  .msg {
    font-size: 12px;
    text-align: center;
    margin-top: 12px;
    min-height: 18px;
    letter-spacing: 0.05em;
  }
  .msg.error   { color: #e07070; }
  .msg.success { color: #70c070; }
</style>
</head>
<body>

<div class="logo"><img id="logo"src="pics/logo4.png"></div>
<div class="logo-sub">Member Access</div>

<div class="card">

  <div class="field" id="reg-name-field">
    <label>userName</label>
    <input type="text" id="l-name" placeholder="How you'll appear">
  </div>

  <div class="field">
    <label>Email address</label>
    <input type="email" id="l-email" placeholder="your@email.com">
  </div>

  <div class="field">
    <label>Password</label>
    <input type="password" id="l-pass" placeholder="••••••••">
  </div>

  <button class="btn-main" id="btn-main" onclick="handleAuth()">Sign In</button>

  <div class="divider"><span>or</span></div>

  <button class="btn-google" onclick="signInGoogle()">
    <svg width="16" height="16" viewBox="0 0 24 24">
      <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
      <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
      <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
      <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
    </svg>
    Continue with Google
  </button>

  <button class="btn-switch" onclick="switchMode()">No account? <b>Register</b></button>

  <div class="msg" id="msg"></div>

</div>

<script>
  var SURL = 'https://jzspezkljbxocqboqgtk.supabase.co';
  var SKEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imp6c3BlemtsamJ4b2NxYm9xZ3RrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzczMTU4MjMsImV4cCI6MjA5Mjg5MTgyM30.VXZ4ZX9_z33ZKrWUbhs2EXKruTi1kp5IpLuGLykF1y0';
  var sb   = supabase.createClient(SURL, SKEY);
  var mode = 'login';

  // if already logged in go home
  sb.auth.getSession().then(function(r) {
    if (r.data.session) window.location.href = 'index.html';
  });

  function switchMode() {
    mode = mode === 'login' ? 'register' : 'login';
    var nameField  = document.getElementById('reg-name-field');
    var btn        = document.getElementById('btn-main');
    var switchBtn  = document.querySelector('.btn-switch');
    nameField.style.display = mode === 'register' ? 'block' : 'none';
    btn.textContent         = mode === 'login' ? 'Sign In' : 'Create Account';
    switchBtn.textContent   = mode === 'login' ? 'No account? Register' : 'Already have an account? Sign in';
    document.getElementById('msg').textContent = '';
  }

  function handleAuth() {
    var email = document.getElementById('l-email').value.trim();
    var pass  = document.getElementById('l-pass').value;
    var btn   = document.getElementById('btn-main');
    var msg   = document.getElementById('msg');

    if (!email || !pass) { showMsg('Fill in all fields', 'error'); return; }

    btn.disabled    = true;
    btn.textContent = 'Please wait...';

    if (mode === 'login') {
      sb.auth.signInWithPassword({ email: email, password: pass })
      .then(function(r) {
        if (r.error) {
          showMsg(r.error.message, 'error');
          btn.disabled    = false;
          btn.textContent = 'Sign In';
        } else {
          showMsg('Welcome back!', 'success');
          setTimeout(function() { window.location.href = 'index.html'; }, 600);
        }
      });
    } else {
      var name = document.getElementById('l-name').value.trim();
      if (!name) { showMsg('Enter a display name', 'error'); btn.disabled = false; btn.textContent = 'Create Account'; return; }
      if (pass.length < 6) { showMsg('Password must be 6+ characters', 'error'); btn.disabled = false; btn.textContent = 'Create Account'; return; }

      sb.auth.signUp({
        email   : email,
        password: pass,
        options : { data: { display_name: name } }
      })
      .then(function(r) {
        if (r.error) {
          showMsg(r.error.message, 'error');
          btn.disabled    = false;
          btn.textContent = 'Create Account';
        } else {
          showMsg('Account created!', 'success');
          setTimeout(function() { window.location.href = '/index.html'; }, 600);
        }
      });
    }
  }

  function signInGoogle() {
    sb.auth.signInWithOAuth({
      provider: 'google',
      options : { redirectTo: window.location.origin + '/index.html' }
    });
  }

  function showMsg(text, type) {
    var el = document.getElementById('msg');
    el.textContent = text;
    el.className   = 'msg ' + type;
  }
</script>

</body>
</html>
