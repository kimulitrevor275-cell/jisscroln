<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile | The JisScroL</title>
  <link rel="icon" type="image/png" href="/pics/logo4.png">
  <link rel="stylesheet" href="/global.css">
  <meta name="theme-color" content="#000000">
  <style>
    [hidden] { display:none !important; }
    #user-greeting { display:flex; align-items:center; gap:8px; font-family:'Outfit',sans-serif; font-size:25px; color:#fff; white-space:nowrap; }

    .profile { max-width:680px; margin:40px auto 80px; padding:0 20px; font-family:'Outfit',sans-serif; color:#fff; }

    .identity { display:flex; align-items:center; gap:24px; flex-wrap:wrap; margin-bottom:32px; }
    .avatar { width:96px; height:96px; flex-shrink:0; border-radius:50%; border:1px solid #333; background:#141414; display:grid; place-items:center; color:#8a8a8a; }
    .avatar svg { width:56px; height:56px; }
    .name { margin:0; font-size:clamp(30px,6vw,44px); font-weight:400; line-height:1.15; overflow-wrap:anywhere; }
    .name svg { width:28px; height:28px; margin-left:8px; vertical-align:middle; }
    .name .btn { margin-left:14px; font-size:16px; padding:3px 14px; border-radius:50px; vertical-align:middle; }
    .email-top { margin:6px 0 0; color:#8a8a8a; font-size:20px; overflow-wrap:anywhere; }

    .card { border:1px solid #2a2a2a; border-radius:16px; background:#141414; margin-bottom:16px; }
    .item { padding:20px 24px; border-bottom:1px solid #2a2a2a; }
    .item:last-child { border-bottom:none; }
    .item-head { display:flex; align-items:center; justify-content:space-between; gap:16px; }
    .item-label { color:#8a8a8a; font-size:16px; }
    .item-value { margin-top:2px; font-size:22px; overflow-wrap:anywhere; }
    .card h3 { margin:0 0 8px; font-size:22px; font-weight:400; }
    .card p { margin:0 0 14px; color:#bdbdbd; font-size:18px; line-height:1.5; }
    .card b { font-weight:500; color:#fff; overflow-wrap:anywhere; }

    .inline { display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-top:8px; }
    .profile input { flex:1; min-width:0; background:#000; border:1px solid #333; border-radius:10px; padding:11px 14px; color:#e8e8e8; font:inherit; font-size:19px; outline:none; }
    .profile input:focus { border-color:#fff; }
    .btn { background:transparent; color:#fff; border:1px solid #fff; border-radius:8px; padding:7px 18px; font:inherit; font-size:18px; cursor:pointer; transition:background .2s, color .2s; }
    .btn:hover:not(:disabled) { background:#fff; color:#000; }
    .btn:disabled { opacity:.4; cursor:default; }
    .btn:focus-visible, .profile input:focus-visible, .link:focus-visible { outline:2px solid #c9a96e; outline-offset:2px; }
    .link { background:none; border:none; padding:6px 4px; color:#8a8a8a; font:inherit; font-size:18px; text-decoration:underline; cursor:pointer; }
    .link:hover { color:#fff; }
    .msg { min-height:18px; margin:8px 0 0 !important; font-size:16px !important; color:#e07070 !important; }
    .btn.signout { color:#e5534b; border-color:#e5534b; margin-top:16px; }
    .btn.signout:hover:not(:disabled) { background:#e5534b; color:#fff; }
  </style>
</head>
<body>
  <header id="header">
    <div style="display:flex; align-items:center; justify-content:space-between;">
      <div style="display:flex; align-items:center; gap:12px;">
        <img class="site-logo" src="/pics/logog.svg" alt="JS">
        <h1 style="margin:0; font-family: 'Outfit', serif;">The JisScroL</h1>
      </div>
    </div>
  </header>

  <main class="profile">
    <section class="identity">
      <div class="avatar" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="9" r="4" fill="currentColor"/><path d="M4.5 21c1.2-4 4-6 7.5-6s6.300 2 7.500 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      </div>
      <div>
        <h3 class="name"><span id="name-text">Loading...</span><span id="name-badge"></span></h3>
        <p class="email-top" id="email-top"></p>
      </div>
    </section>

    <section class="card" id="verify-card" hidden>
      <div class="item">
        <h3>Get verified</h3>
        <p>Open the confirmation email sent to <b id="verify-email"></b> (check spam too) and select the link, then press "I've verified".</p>
        <div class="inline" style="margin-top:0">
          <button class="btn" id="resend-btn" type="button">Resend email</button>
          <button class="btn" id="check-btn" type="button">I've verified</button>
        </div>
        <p class="msg" id="verify-msg" role="alert"></p>
      </div>
    </section>

    <section class="card">
      <div class="item">
        <div class="item-head" id="name-show">
          <div>
            <div class="item-label">Display name</div>
            <div class="item-value" id="name-val">Loading...</div>
          </div>
          <button class="btn" id="name-edit" type="button" disabled>Edit</button>
        </div>
        <div id="name-form" hidden>
          <label class="item-label" for="name-input">Display name</label>
          <div class="inline">
            <input id="name-input" type="text" maxlength="30">
            <button class="btn" id="name-save" type="button">Save</button>
            <button class="link" id="name-cancel" type="button">Cancel</button>
          </div>
        </div>
        <p class="msg" id="name-msg" role="alert"></p>
      </div>

      <div class="item">
        <div class="item-head" id="email-show">
          <div>
            <div class="item-label">Email</div>
            <div class="item-value" id="email-val">Loading...</div>
          </div>
          <button class="btn" id="email-edit" type="button" disabled>Edit</button>
        </div>
        <div id="email-form" hidden>
          <label class="item-label" for="email-input">Email</label>
          <div class="inline">
            <input id="email-input" type="email">
            <button class="btn" id="email-save" type="button">Save</button>
            <button class="link" id="email-cancel" type="button">Cancel</button>
          </div>
        </div>
        <p class="msg" id="email-msg" role="alert"></p>
      </div>

      <div class="item">
        <div class="item-head" id="pw-show">
          <div>
            <div class="item-label">Password</div>
            <div class="item-value">••••••••</div>
          </div>
          <button class="btn" id="pw-edit" type="button">Change</button>
        </div>
        <div id="pw-form" hidden>
          <label class="item-label" for="pw1">New password</label>
          <div class="inline">
            <input id="pw1" type="password" autocomplete="new-password">
          </div>
          <label class="item-label" for="pw2" style="display:block; margin-top:12px">Confirm password</label>
          <div class="inline">
            <input id="pw2" type="password" autocomplete="new-password">
            <button class="btn" id="pw-save" type="button">Save</button>
            <button class="link" id="pw-cancel" type="button">Cancel</button>
          </div>
        </div>
        <p class="msg" id="pw-msg" role="alert"></p>
      </div>
    </section>

    <button class="btn signout" id="signout-btn" type="button">Sign out</button>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/auth.js"></script>
  <script>
    (function () {
      "use strict";

      /* ── Helpers ─────────────────────────────── */
      var $ = function (id) { return document.getElementById(id); };
      var say = function (id, text) { $(id).textContent = text; };

      // Disables a button while a request runs; always re-enables it, even offline.
      function submit(btn, task) {
        btn.disabled = true;
        return task()
          .catch(function () { return { error: { message: "No connection" } }; })
          .then(function (res) { btn.disabled = false; return res; });
      }

      /* ── State ───────────────────────────────── */
      var user = null;
      var currentName = "";

      /* ── Identity: name and badge ────────────── */
      function setName(name) {
        currentName = name;
        $("name-text").textContent = name;
        $("name-val").textContent = name;
      }

      function renderBadge() {
        if (!user) return;
        var box = $("name-badge");
        if (user.email_confirmed_at) {
          box.innerHTML = _makeBadge(window._cachedTier, 28);
          $("verify-card").hidden = true;
        } else {
          box.innerHTML = '<button type="button" class="btn" id="get-verified">Get verified</button>';
          $("get-verified").addEventListener("click", function () {
            $("verify-card").hidden = !$("verify-card").hidden;
          });
        }
      }

      // auth.js fetches the tier in the background; redraw the badge when it arrives.
      function waitForTier() {
        var waited = 0;
        var timer = setInterval(function () {
          waited += 500;
          if (window._cachedTier) { clearInterval(timer); renderBadge(); }
          else if (waited >= 30000) clearInterval(timer);
        }, 500);
      }

      /* ── Inline editing (shared by name, email, password) ── */
      var FIELDS = {
        name:  { inputs: ["name-input"],  reset: function () { $("name-input").value = currentName; } },
        email: { inputs: ["email-input"], reset: function () { $("email-input").value = user ? user.email : ""; } },
        pw:    { inputs: ["pw1", "pw2"],  reset: function () { $("pw1").value = ""; $("pw2").value = ""; } }
      };

      function setEditing(field, on) {
        $(field + "-show").hidden = on;
        $(field + "-form").hidden = !on;
        say(field + "-msg", "");
        FIELDS[field].reset();
        if (on) $(FIELDS[field].inputs[0]).focus();
      }

      Object.keys(FIELDS).forEach(function (field) {
        $(field + "-edit").addEventListener("click", function () { setEditing(field, true); });
        $(field + "-cancel").addEventListener("click", function () { setEditing(field, false); });
        FIELDS[field].inputs.forEach(function (id) {
          $(id).addEventListener("keydown", function (e) {
            if (e.key === "Enter") $(field + "-save").click();
            if (e.key === "Escape") setEditing(field, false);
          });
        });
      });

      /* ── Save: display name ──────────────────── */
      $("name-save").addEventListener("click", function () {
        var value = $("name-input").value.trim();
        if (value.length < 2) { say("name-msg", "Enter a name with at least 2 characters."); return; }
        if (value === currentName) { setEditing("name", false); return; }

        submit($("name-save"), function () {
          return sb.auth.updateUser({ data: { display_name: value } });
        }).then(function (res) {
          if (res.error) { say("name-msg", "Could not save: " + res.error.message); return; }
          setName(value);
          window._cachedUsername = value;
          sessionStorage.setItem("jis_username", value);
          setEditing("name", false);
          showToast("Name saved");
        });
      });

      /* ── Save: email ─────────────────────────── */
      $("email-save").addEventListener("click", function () {
        var value = $("email-input").value.trim();
        if (!/^\S+@\S+\.\S+$/.test(value)) { say("email-msg", "Enter a valid email address."); return; }
        if (value.toLowerCase() === user.email.toLowerCase()) { setEditing("email", false); return; }

        submit($("email-save"), function () {
          return sb.auth.updateUser({ email: value });
        }).then(function (res) {
          if (res.error) { say("email-msg", "Could not save: " + res.error.message); return; }
          setEditing("email", false);
          showToast("Check your new email to confirm the change");
        });
      });

      /* ── Save: password ──────────────────────── */
      $("pw-save").addEventListener("click", function () {
        var a = $("pw1").value;
        var b = $("pw2").value;
        if (a.length < 8) { say("pw-msg", "Use at least 8 characters."); return; }
        if (a !== b) { say("pw-msg", "The two passwords do not match."); return; }

        submit($("pw-save"), function () {
          return sb.auth.updateUser({ password: a });
        }).then(function (res) {
          if (res.error) { say("pw-msg", "Could not save: " + res.error.message); return; }
          setEditing("pw", false);
          showToast("Password changed");
        });
      });

      /* ── Verification ────────────────────────── */
      $("resend-btn").addEventListener("click", function () {
        var btn = $("resend-btn");
        say("verify-msg", "");

        submit(btn, function () {
          return sb.auth.resend({ type: "signup", email: user.email });
        }).then(function (res) {
          if (res.error) { say("verify-msg", "Could not send: " + res.error.message); return; }
          showToast("Email sent");
          var left = 60;
          btn.disabled = true;
          var timer = setInterval(function () {
            left--;
            btn.textContent = left > 0 ? "Resend in " + left + "s" : "Resend email";
            if (left <= 0) { clearInterval(timer); btn.disabled = false; }
          }, 1000);
        });
      });

      $("check-btn").addEventListener("click", function () {
        say("verify-msg", "");

        submit($("check-btn"), function () {
          return sb.auth.getUser();
        }).then(function (res) {
          if (res.error || !res.data || !res.data.user) {
            say("verify-msg", "Could not check right now. Try again.");
            return;
          }
          user = res.data.user;
          renderBadge();
          if (!user.email_confirmed_at) {
            say("verify-msg", "Still not verified. Select the link in the email first.");
          }
        });
      });

      /* ── Sign out ────────────────────────────── */
      $("signout-btn").addEventListener("click", function () { signOut(); });

      /* ── Init ────────────────────────────────── */
      sb.auth.getSession().then(function (r) {
        var session = r.data.session;
        if (!session) { window.location.href = "/login/"; return; }

        user = session.user;
        setName((user.user_metadata && user.user_metadata.display_name) || user.email);
        $("email-top").textContent = user.email;
        $("email-val").textContent = user.email;
        $("verify-email").textContent = user.email;
        $("name-edit").disabled = false;
        $("email-edit").disabled = false;

        renderBadge();
        waitForTier();
      }).catch(function () {
        say("name-msg", "Could not load your profile. Refresh the page.");
      });
    })();
  </script>
</body>
</html>
