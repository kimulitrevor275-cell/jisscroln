<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  
  <meta name="theme-color" content="#0a0a0a">
  <title>Search | The JiScroL</title>
  <link rel="icon" type="image/svg+xml" href="/pics/logog.svg">
  <link rel="stylesheet" href="/global.css">
  <link rel="stylesheet" href="/search/search.css">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>
<body>
  <main class="search-page">
    <section class="search-intro" aria-labelledby="search-title">
      <form id="site-search-form" role="search">
        <label class="visually-hidden" for="site-search-input">Search articles, stories, and songs</label>
        <span class="search-input-icon" aria-hidden="true">⌕</span>
        <input id="site-search-input" name="q" type="search" placeholder="Search anything..." autocomplete="off" maxlength="120">
        <button type="submit">Search <span aria-hidden="true">→</span></button>
      </form>
      <section id="search-results-section" aria-label="Search results" hidden>
        <div class="results-heading">
          <p class="section-kicker">SEARCH</p>
          <h2 id="results-title">Results</h2>
        </div>
        <div id="site-search-results" aria-live="polite" aria-busy="false"></div>
      </section>
      <h1 id="search-title">Find your next read.</h1>
      <p class="search-hint">Try a topic, artist, or headline</p>
    </section>

    <section id="search-discovery" aria-label="Discover articles and music">
      <div class="discovery-section">
        <div class="discovery-heading">
          <div><p class="section-kicker">THE LATEST</p><h2>Fresh reads</h2></div>
          <a href="/trends/">All stories <span aria-hidden="true">→</span></a>
        </div>
        <div id="featured-articles" class="featured-article-grid" aria-live="polite" aria-busy="true">
          <p class="discovery-message">Finding stories for you…</p>
        </div>
      </div>

      <div class="discovery-section music-discovery">
        <div class="discovery-heading">
          <div><p class="section-kicker">SOUNDTRACK</p><h2>On repeat</h2></div>
          <a href="/others/">Explore music <span aria-hidden="true">→</span></a>
        </div>
        <div id="featured-songs" class="featured-song-grid" aria-live="polite" aria-busy="true">
          <p class="discovery-message">Loading the latest tracks…</p>
        </div>
      </div>
    </section>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/auth.js"></script>
  <script src="/search/search.js"></script>
</body>
</html>
