<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
 
  <meta name="theme-color" content="#0a0a0a">
  <title>Search | The JiScroL</title>
  <link rel="icon" type="image/svg+xml" href="/pics/logog.svg">
  <link rel="stylesheet" href="/global.css">
  <link rel="stylesheet" href="/search/search.css">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
  <script>
  window.va = window.va || function () { (window.va.q = window.va.q || []).push(arguments); };
</script>
<script defer src="/_vercel/insights/script.js"></script>
</head>
<body>
  <main class="search-page">
    <section class="search-intro" aria-label="Search">
      <form id="site-search-form" role="search">
        <label class="visually-hidden" for="site-search-input">Search articles, stories, and songs</label>
        
        <input id="site-search-input" name="q" type="search" placeholder="Search anything..." autocomplete="off" maxlength="120">
        <button type="submit">
          <svg class="search-button-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="10.8" cy="10.8" r="6.8"/><path d="m16 16 4.5 4.5"/></svg>
          <span>Search</span>
        </button>
      </form>
      <section id="search-results-section" aria-label="Search results" hidden>
        <div class="results-heading">
          <h2 id="results-title">Results</h2>
        </div>
        <div id="site-search-results" aria-live="polite" aria-busy="false"></div>
      </section>
    </section>

    <section id="search-discovery" aria-label="Discover articles and music">
      <div class="discovery-section">
        <div class="discovery-heading">
          <a href="/trends/">Trending stories <span aria-hidden="true">→</span></a>
        </div>
        <div id="featured-articles" class="featured-article-grid" aria-live="polite" aria-busy="true">
          <div class="discovery-skeleton-list" aria-hidden="true">
            <div class="discovery-skeleton-row"><span class="discovery-skeleton-thumb"></span><span class="discovery-skeleton-copy"><i></i><i></i></span></div>
            <div class="discovery-skeleton-row"><span class="discovery-skeleton-thumb"></span><span class="discovery-skeleton-copy"><i></i><i></i></span></div>
            <div class="discovery-skeleton-row"><span class="discovery-skeleton-thumb"></span><span class="discovery-skeleton-copy"><i></i><i></i></span></div>
          </div>
        </div>
      </div>

      <div class="discovery-section music-discovery">
        <div class="discovery-heading">

          <a href="/others/">Latest music <span aria-hidden="true">→</span></a>
        </div>
        <div id="featured-songs" class="featured-song-grid" aria-live="polite" aria-busy="true">
          <div class="discovery-skeleton-list" aria-hidden="true">
            <div class="discovery-skeleton-row"><span class="discovery-skeleton-thumb"></span><span class="discovery-skeleton-copy"><i></i><i></i></span></div>
            <div class="discovery-skeleton-row"><span class="discovery-skeleton-thumb"></span><span class="discovery-skeleton-copy"><i></i><i></i></span></div>
            <div class="discovery-skeleton-row"><span class="discovery-skeleton-thumb"></span><span class="discovery-skeleton-copy"><i></i><i></i></span></div>
          </div>
        </div>
      </div>
    </section>
   <div id="site-footer" data-full></div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../auth.js"></script>
  <script src="/search/search.js"></script>
</body>
</html>
